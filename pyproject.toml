[project]
name = "experimentlab"
version = "0.1.0"
description = "A reproducible A/B testing and experiment validation platform"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "streamlit>=1.40",
]

[project.scripts]
experimentlab-generate = "experimentlab.generation.generator:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
